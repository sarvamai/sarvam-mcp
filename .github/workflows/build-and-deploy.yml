name: Build and Push Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AZURE_USERNAME: "gitopsdocker"
  AZURE_REGISTRY: "gitopsdocker.azurecr.io"

jobs:
  build-and-push:
    runs-on: [self-hosted, size-small-public]
    if: github.repository == 'sarvamai/sarvam-mcp'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure
        if: github.event_name == 'push'
        run: |
          echo "$AZURE_REGISTRY_PASSWORD" | docker login ${{ env.AZURE_REGISTRY }} \
            -u ${{ env.AZURE_USERNAME }} --password-stdin

      - name: Production Gate Check
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-prod')
        shell: bash
        run: |
          echo "Production tag detected. Verifying branch lineage..."
          if git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "Success: Tagged commit exists on the main branch."
          else
            echo "FAILURE: Production tags must match a commit on main."
            exit 1
          fi

      - name: Determine Tags
        if: github.event_name == 'push'
        id: meta
        shell: bash
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_NAME="sarvam-mcp-website"
          AZURE_IMAGE="${{ env.AZURE_REGISTRY }}/$IMAGE_NAME"

          if [[ "${{ github.ref_name }}" == "main" ]]; then
            VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            TAG_NAME="v${VERSION}-prod"
            ENV_TAG="latest"
          else
            TAG_NAME="${{ github.ref_name }}"
            if echo "$TAG_NAME" | grep -q '\-prod$'; then
              ENV_TAG="latest"
            elif echo "$TAG_NAME" | grep -q '\-staging$'; then
              ENV_TAG="latest-staging"
            else
              ENV_TAG="latest-qa"
            fi
          fi

          TAGS="${AZURE_IMAGE}:${TAG_NAME},${AZURE_IMAGE}:${SHORT_SHA},${AZURE_IMAGE}:${ENV_TAG}"
          echo "Calculated Tags: $TAGS"
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: web
          file: web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags || 'sarvam-mcp-website:pr-check' }}
          cache-from: type=registry,ref=${{ env.AZURE_REGISTRY }}/sarvam-mcp-website:buildcache
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}/sarvam-mcp-website:buildcache,mode=max', env.AZURE_REGISTRY) || '' }}
