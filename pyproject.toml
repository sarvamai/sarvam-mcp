[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sarvam-mcp"
version = "0.1.0"
description = "Official Sarvam AI MCP server — STT, TTS, Translate, Transliterate, LLM, Vision OCR for Indic languages"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sarvam AI", email = "support@sarvam.ai" }]
keywords = ["sarvam", "mcp", "model-context-protocol", "tts", "stt", "indic", "translation", "indian-languages"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.6",
    "anyio>=4.3",
    "uvicorn>=0.29.0",
    "starlette>=0.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
sarvam-mcp = "sarvam_mcp.server:main"
sarvam-mcp-http = "sarvam_mcp.http_server:main_http"

[project.urls]
Homepage = "https://mcp.sarvam.ai"
Documentation = "https://docs.sarvam.ai"
Repository = "https://github.com/sarvamai/sarvam-mcp"
Issues = "https://github.com/sarvamai/sarvam-mcp/issues"
Changelog = "https://github.com/sarvamai/sarvam-mcp/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/sarvam_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/sarvam_mcp",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
# 110 fits the longer disambiguation prefix added to every tool description
# ("Runtime tool — calls Sarvam API now. For code-writing help, use sarvam_code_* tools.")
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
# B008: Pydantic Field() in defaults is idiomatic for FastMCP tool signatures.
# A003: tool args use names like `input` / `id` matching the Sarvam API.
ignore = ["B008", "A003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# Data + snippet modules are mostly tables / embedded code blocks; the
# line-length rule produces false positives that hurt readability.
"src/sarvam_mcp/code/_data.py" = ["E501"]
"src/sarvam_mcp/code/_snippets.py" = ["E501"]
"src/sarvam_mcp/code/snippets.py" = ["E501"]
"src/sarvam_mcp/code/docs.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
